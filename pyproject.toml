[project]
name = "satquery-ai"
version = "0.1.0"
description = "SatQuery AI - Agentic Vision-Language Assistant for Remote Sensing Imagery"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "datasets>=2.18.0",
    "huggingface_hub>=0.22.0",
    "rasterio>=1.3.9",
    "pillow>=10.2.0",
    "numpy>=1.26.0,<2.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "pyproj>=3.6.1",
    "affine>=2.4.0",
    "tifffile>=2024.2.12",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
